name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./Notes.Api/Notes.Api.sln

      - name: Build
        run: dotnet build ./Notes.Api/Notes.Api.sln --no-restore -c Release

      - name: Test
        run: dotnet test ./Notes.Api/Notes.Api.sln --no-build -c Release